<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Information</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Employee Information</h1>
      <p class="subtitle">Data is read from <code>data/employees.xml</code> and shown in a table.</p>
    </header>

    <section class="toolbar">
      <input type="search" id="search" placeholder="Search by name, department, city..." aria-label="Search employees">
      <select id="deptFilter" aria-label="Filter by department">
        <option value="">All departments</option>
      </select>
      <label class="file-btn">
        Load another XML
        <input type="file" id="fileInput" accept=".xml,text/xml,application/xml" hidden>
      </label>
    </section>

    <div id="status" class="status" role="status"></div>

    <div class="table-wrap">
      <table id="empTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <p id="count" class="count"></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
